<div class="container" style="padding-bottom:30px">
    <div class="row">
        <div class="col-lg-3">
            <div class="hero__categories">
                <div class="hero__categories__all" (click)="toggleList('departments')">
                    <i class="fa fa-bars"></i>
                    <span>All departments</span>
                </div>
                <ul [@toggleList]="isOpen['departments'] ? 'open' : 'closed'" class="list__categories">
                    <li><a href="#">Fresh Meat</a></li>
                    <li><a href="#">Vegetables</a></li>
                    <li><a href="#">Fruit & Nut Gifts</a></li>
                    <li><a href="#">Fresh Berries</a></li>
                    <li><a href="#">Ocean Foods</a></li>
                    <li><a href="#">Butter & Eggs</a></li>
                    <li><a href="#">Fastfood</a></li>
                    <li><a href="#">Fresh Onion</a></li>
                    <li><a href="#">Papayaya & Crisps</a></li>
                    <li><a href="#">Oatmeal</a></li>
                    <li><a href="#">Fresh Bananas</a></li>
                </ul>
            </div>
        </div>
        <div class="col-lg-9">
            <div class="">
                <div class="hero__search__form">
                    <form action="#">
                        <div class="hero__search__categories dropdown-wrapper" (click)="toggleList('categories')" (appClickOutside)="closeList('categories')">
                            <div>
                                All Categories
                                <span class="arrow_carrot-down"></span>
                            </div>
                            <ul [@toggleList]="isOpen['categories'] ? 'open' : 'closed'" class="list__cat">
                                <li><a href="#">Toys</a></li>
                                <li><a href="#">Food</a></li>
                                <li><a href="#">Clothes</a></li>

                            </ul>
                        </div>
                        <input type="text" placeholder="What do yo u need?">
                        <button type="submit" class="site-btn">SEARCH</button>
                    </form>


                </div>
               
                <div class="hero__search__phone">
                    <div class="hero__search__phone__icon">
                        <i class="fa fa-phone"></i>
                    </div>
                    <div class="hero__search__phone__text">
                        <h5>+65 11.188.888</h5>
                        <span>support 24/7 time</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
</div>
